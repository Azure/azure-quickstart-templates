name: test-scripts

# Runs Bats tests for the bash helpers and Node tests for the prompt builder
# under .github/scripts/.
#
# Triggered only when the scripts or their tests change so we don't burn
# minutes on unrelated PRs. Kept intentionally small and dependency-light:
# Bats + jq from apt and the Node runtime used by the repository workflows.

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - 'test/scripts/**'
      - '.github/workflows/test-scripts.yml'
  push:
    branches: [master, main]
    paths:
      - '.github/scripts/**'
      - 'test/scripts/**'
      - '.github/workflows/test-scripts.yml'

permissions:
  contents: read

jobs:
  bats:
    name: bats (.github/scripts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Install bats and jq
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bats jq
          bats --version
          jq --version

      - name: Syntax-check shell scripts
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in .github/scripts/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Run bats tests
        run: bats --print-output-on-failure test/scripts

      - name: Run Node tests
        run: node --test test/scripts/build-summary-prompt.test.cjs
